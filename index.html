<!doctype html>

  <body>
<body>
        <div class="bagts1">
            <img class="sun" src="sun.png" alt="">
            <div style="--orbit-size: 150px; --orbit-animation: spin 8.8s linear infinite;" class="orbit mercury">
                <img style="--planet-size: 15px; --planet-animation: spin 5.86s linear infinite;" class="planet" src="mercury.png" alt="">
            </div>
            <div style="--orbit-size: 200px; --orbit-animation: spin 22.5s linear infinite;" class="orbit venus">
                <img style="--planet-size: 20px; --planet-animation: spin 24.3s linear infinite;" class="planet" src="venus.png" alt="">
            </div>  
            <div style="--orbit-size: 250px; --orbit-animation: spin 36.5s linear infinite;" class="orbit earth">
                <img style="--planet-size: 23px; --planet-animation: spin 1s linear infinite;" class="planet" src="earth.png" alt="">
            </div>
            <div style="--orbit-size: 320px; --orbit-animation: spin 68.7s linear infinite;" class="orbit mars">
                <img style="--planet-size: 17px; --planet-animation: spin 1.025s linear infinite;" class="planet" src="mars.png" alt="">
            </div>
            <div style="--orbit-size: 440px; --orbit-animation: spin 118.6s linear infinite;" class="orbit jupiter">
                <img style="--planet-size: 45px; --planet-animation: spin 0.41s linear infinite;" class="planet" src="jupiter.png" alt="">
            </div>
            <div style="--orbit-size: 560px; --orbit-animation: spin 294.6s linear infinite;" class="orbit saturn">
                <img style="--planet-size: 40px; --planet-animation: spin 0.445s linear infinite;" class="planet" src="saturn.png" alt="">
            </div>
            <div style="--orbit-size: 660px; --orbit-animation: spin 840s linear infinite;" class="orbit uranus">
                <img style="--planet-size: 35px; --planet-animation: spin 0.717s linear infinite;" class="planet" src="uranus.png" alt="">
            </div>
            <div style="--orbit-size: 760px; --orbit-animation: spin 1648s linear infinite;" class="orbit neptune">
                <img style="--planet-size: 33px; --planet-animation: spin 0.671s linear infinite;" class="planet" src="neptune.png" alt="">
            </div>
        </div>
</body>
